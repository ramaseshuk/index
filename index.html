<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset / IPad Issues - Live Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-orange: #fb923c;
            --accent-purple: #c084fc;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(74, 222, 128, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(74, 222, 128, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Metrics Display */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .kpi-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .kpi-card:nth-child(1) .kpi-value { color: var(--accent-blue); }
        .kpi-card:nth-child(2) .kpi-value { color: var(--accent-orange); }
        .kpi-card:nth-child(3) .kpi-value { color: var(--accent-purple); }
        .kpi-card:nth-child(4) .kpi-value { color: var(--accent-green); }

        /* Data Table */
        .table-container {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .table-header {
            padding: 16px 24px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .table-scroll-area {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            position: sticky;
            top: 0;
            background-color: var(--card-bg);
            color: var(--text-secondary);
            font-weight: 600;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Reduced column sizes */
        .col-timestamp {
            width: 10%;
            white-space: nowrap;
        }

        .col-class {
            width: 6%;
            white-space: nowrap;
        }

        .badge-type {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
        }

        /* Hide Scrollbar */
        .table-scroll-area::-webkit-scrollbar {
            width: 6px;
        }
        .table-scroll-area::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📱 Password Reset / IPad Issues - Live Monitor</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            Live Auto-Sync
        </div>
    </header>

    <section class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">Total Submissions</div><div class="kpi-value" id="kpi-total">0</div></div>
        <div class="kpi-card"><div class="kpi-label">Password Resets</div><div class="kpi-value" id="kpi-password">0</div></div>
        <div class="kpi-card"><div class="kpi-label">App Issues / Installs</div><div class="kpi-value" id="kpi-apps">0</div></div>
        <div class="kpi-card"><div class="kpi-label">Other Issues</div><div class="kpi-value" id="kpi-other">0</div></div>
    </section>

    <section class="table-container">
        <div class="table-header">Recent Submissions</div>
        <div class="table-scroll-area" id="scroll-area">
            <table>
                <thead>
                    <tr>
                        <th class="col-timestamp">Timestamp</th>
                        <th>Student Name</th>
                        <th class="col-class">Class</th>
                        <th>Type of Issue</th>
                        <th>iPad Issue</th>
                        <th>App to Install</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="7" style="text-align: center; color: var(--text-secondary); padding: 40px;">Connecting to Google Sheet...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        const SHEET_ID = '1W1ZuO0kAfWFcqfwf4jJ50fRaB2ZDctFKsgFzWDFP_Wk';

        // JSONP Callback handler executed by Google Visualization API response
        window.handleGoogleSheetData = function(json) {
            try {
                if (!json || !json.table || !json.table.rows) {
                    throw new Error("Invalid spreadsheet format received");
                }
                renderDashboard(json.table.rows);
            } catch (err) {
                console.error("Dashboard Render Error:", err);
                document.getElementById('table-body').innerHTML = `
                    <tr><td colspan="7" style="text-align: center; color: #f87171; padding: 40px;">
                        Unable to parse response data.
                    </td></tr>`;
            }
        };

        // Inject dynamic script tag to load data without triggering CORS block
        function loadSheetData() {
            const oldScript = document.getElementById('gviz-script');
            if (oldScript) {
                oldScript.remove();
            }

            const script = document.createElement('script');
            script.id = 'gviz-script';
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleGoogleSheetData`;
            
            script.onerror = function() {
                document.getElementById('table-body').innerHTML = `
                    <tr><td colspan="7" style="text-align: center; color: #f87171; padding: 40px;">
                        <strong>Access Blocked:</strong> Ensure your Google Sheet access is set to<br>
                        <strong>"Anyone with the link can view"</strong> under <em>Share</em> settings.
                    </td></tr>`;
            };

            document.body.appendChild(script);
        }

        function renderDashboard(rows) {
            let total = rows.length;
            let passwordCount = 0;
            let appCount = 0;
            let otherCount = 0;
            let html = '';

            // Render rows in reverse chronological order (newest on top)
            for (let i = rows.length - 1; i >= 0; i--) {
                const cells = rows[i].c;
                if (!cells) continue;

                const timestamp = cells[0] ? (cells[0].f || cells[0].v || '-') : '-';
                const studentName = cells[1] ? (cells[1].v || '-') : '-';
                const studentClass = cells[2] ? (cells[2].v || '-') : '-';
                const issueType = cells[3] ? (cells[3].v || '-') : '-';
                const ipadApp = cells[4] ? (cells[4].v || '-') : '-';
                const appToInstall = cells[5] ? (cells[5].v || '-') : '-';
                const actions = cells[6] ? (cells[6].v || '-') : '-';

                // Categorize for KPIs
                const issueLower = String(issueType).toLowerCase();
                if (issueLower.includes('password') || issueLower.includes('mims')) {
                    passwordCount++;
                } else if (issueLower.includes('app') || (ipadApp !== 'Not Applicable' && ipadApp !== '-') || appToInstall !== '-') {
                    appCount++;
                } else {
                    otherCount++;
                }

                html += `
                    <tr>
                        <td class="col-timestamp">${timestamp}</td>
                        <td><strong>${studentName}</strong></td>
                        <td class="col-class">${studentClass}</td>
                        <td><span class="badge-type">${issueType}</span></td>
                        <td>${ipadApp}</td>
                        <td>${appToInstall}</td>
                        <td>${actions}</td>
                    </tr>
                `;
            }

            // Update Metrics
            document.getElementById('kpi-total').textContent = total;
            document.getElementById('kpi-password').textContent = passwordCount;
            document.getElementById('kpi-apps').textContent = appCount;
            document.getElementById('kpi-other').textContent = otherCount;

            // Render Table Rows
            document.getElementById('table-body').innerHTML = html || '<tr><td colspan="7" style="text-align:center;">No records found.</td></tr>';
        }

        // Smooth Auto Scrolling for TV Monitors
        function startAutoScroll() {
            const container = document.getElementById('scroll-area');
            let scrollAmount = 0;
            
            setInterval(() => {
                if (container.scrollHeight > container.clientHeight) {
                    scrollAmount += 1;
                    if (scrollAmount >= container.scrollHeight - container.clientHeight) {
                        scrollAmount = 0;
                    }
                    container.scrollTop = scrollAmount;
                }
            }, 50);
        }

        // Initial fetch and 30-second refresh timer
        loadSheetData();
        setInterval(loadSheetData, 30000);
        startAutoScroll();
    </script>
</body>
</html>
